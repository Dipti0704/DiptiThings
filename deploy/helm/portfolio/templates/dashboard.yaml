{{- if .Values.monitoring.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "portfolio.fullname" . }}-dashboard
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  portfolio.json: |-
    {{- .Files.Get "dashboards/portfolio.json" | nindent 4 }}
{{- end }}
