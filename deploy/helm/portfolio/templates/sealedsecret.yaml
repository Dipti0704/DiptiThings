{{- if and .Values.secret.sealed.encryptedData (.Capabilities.APIVersions.Has "bitnami.com/v1alpha1") }}
# Encrypted with the cluster's sealed-secrets public key; only the controller
# in this cluster can decrypt it into a regular Secret.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  encryptedData:
    {{- toYaml .Values.secret.sealed.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ .Values.secret.name }}
      labels:
        {{- include "portfolio.selectorLabels" . | nindent 8 }}
    type: Opaque
{{- end }}
