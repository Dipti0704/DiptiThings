{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "portfolio.fullname" . }}
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "portfolio.fullname" . }}
                port:
                  name: http
{{- if and .Values.ingress.blockMetrics (.Capabilities.APIVersions.Has "traefik.io/v1alpha1") }}
---
# Metrics are for in-cluster Prometheus only. This more specific route wins
# over "/" and only admits loopback, so external clients get 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "portfolio.fullname" . }}-internal-only
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange: ["127.0.0.1/32"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "portfolio.fullname" . }}-metrics-blocked
  labels:
    {{- include "portfolio.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "portfolio.fullname" . }}-internal-only@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api/metrics
            pathType: Prefix
            backend:
              service:
                name: {{ include "portfolio.fullname" . }}
                port:
                  name: http
{{- end }}
{{- end }}
