apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: {{ .Values.charts.traefik }}
    helm:
      valuesObject:
        service:
          spec:
            type: NodePort
        providers:
          kubernetesIngress:
            # NodePort services have no load-balancer address to copy; publish
            # loopback so Ingress status (and Argo CD health) is populated.
            publishedService:
              enabled: false
            ingressEndpoint:
              ip: 127.0.0.1
        ports:
          web:
            nodePort: 30080
          websecure:
            nodePort: 30443
        metrics:
          prometheus:
            service:
              enabled: true
            serviceMonitor:
              enabled: true
            # CRDs arrive with the monitoring app; don't fail rendering before then.
            disableAPICheck: true
        accessLog:
          enabled: true
          format: json
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 192Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
