# Argo CD install values (applied once by scripts/bootstrap.sh).
global:
  domain: argocd.localtest.me

configs:
  params:
    # TLS is not terminated locally; Traefik serves plain HTTP on localtest.me.
    server.insecure: true
  cm:
    # Poll Git every 60s (GitHub webhooks cannot reach a laptop cluster).
    timeout.reconciliation: 60s
    # Report child Application health so sync waves wait for platform apps.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

server:
  ingress:
    enabled: true
    ingressClassName: traefik

# App health/sync metrics for the platform alerts (argocd_app_info etc.).
controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
