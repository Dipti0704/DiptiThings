# Single-node local cluster. Host ports 80/443 map to Traefik's NodePorts so
# http://*.localtest.me (resolves to 127.0.0.1) reaches the ingress.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: portfolio
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"   # not reachable from the LAN
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
